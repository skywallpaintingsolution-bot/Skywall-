name: Build Skywall Business Hub APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Debug Keystore Everywhere
        run: |
          mkdir -p $HOME/.android app
          keytool -genkeypair -v -storetype JKS -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Debug,C=US"
          cp $HOME/.android/debug.keystore .debug.keystore
          cp $HOME/.android/debug.keystore .debugkeystore
          cp $HOME/.android/debug.keystore app/.debug.keystore
          cp $HOME/.android/debug.keystore app/.debugkeystore
          cp $HOME/.android/debug.keystore debug.keystore
          ls -lh $HOME/.android/debug.keystore .debug.keystore app/.debug.keystore

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-configuration-cache --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skywall-Hub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
